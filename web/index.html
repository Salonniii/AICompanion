<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AICompanion Shared Chat</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:linear-gradient(
        180deg,
        #071229 0%,
        #0B1D46 45%,
        #000000 100%
    );
    color:white;
    font-family:'Segoe UI',sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:40px;
}

.logo{
    font-size:60px;
    margin-bottom:10px;
}

.title{
    font-size:36px;
    font-weight:700;
}

.subtitle{
    color:#C4B5FD;
    margin-top:10px;
    font-size:16px;
}

#chat{
    display:flex;
    flex-direction:column;
    gap:16px;
    padding-bottom:30px;
}

.message{
    padding:16px 20px;
    border-radius:24px;
    max-width:80%;
    word-wrap:break-word;
    line-height:1.8;
    font-size:17px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    animation:fadeIn .25s ease;
}

.isUser{
    align-self:flex-end;

    background:linear-gradient(
        135deg,
        #8B5CF6,
        #A855F7
    );

    color:white;

    border-bottom-right-radius:8px;
}

.ai{
    align-self:flex-start;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,0.08);

    color:white;

    border-bottom-left-radius:8px;
}

.message-label{
    font-size:13px;
    font-weight:600;
    margin-bottom:8px;
    opacity:0.85;
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#888;
    font-size:13px;
}

.not-found{
    text-align:center;
    margin-top:120px;
}

.not-found h2{
    margin-bottom:10px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){

    .container{
        padding:14px;
    }

    .title{
        font-size:30px;
    }

    .logo{
        font-size:50px;
    }

    .message{
        max-width:92%;
        font-size:16px;
        padding:14px 16px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">🤖</div>

        <div class="title">
            AICompanion Shared Chat
        </div>

        <div class="subtitle">
            Shared from AICompanion
        </div>

    </div>

    <div id="chat"></div>

    <div class="footer">
        Powered by AICompanion
    </div>

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyA4s96__azaa8I-mJ7oxLiN3liZw7nL98g",
    authDomain: "aicompanion-ee1e6.firebaseapp.com",
    projectId: "aicompanion-ee1e6",
    storageBucket: "aicompanion-ee1e6.firebasestorage.app",
    messagingSenderId: "405479077842",
    appId: "1:405479077842:web:20dedb2faee83288cdba0b",
    measurementId: "G-WH0Q80M7M5"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const path = window.location.pathname;
const chatId = path.split("/chat/")[1];

async function loadChat(){

    try{

        const doc = await db
            .collection("sharedChats")
            .doc(chatId)
            .get();

        if(!doc.exists){

            document.getElementById("chat").innerHTML = `
                <div class="not-found">
                    <h2>Chat not found</h2>
                    <p>This shared conversation may have been removed.</p>
                </div>
            `;

            return;
        }

        const data = doc.data();
        const messages = data.messages || [];

        let html = "";

        messages.forEach(msg => {

            const isUser =
    msg.isUser === true ||
    msg.isUser === true;

            html += `
                <div class="message ${isUser ? "user" : "ai"}">

                    <div class="message-label">
                        ${isUser ? "👤 You" : "🤖 AICompanion"}
                    </div>

                    ${msg.message || ""}
                </div>
            `;
        });

        document.getElementById("chat").innerHTML = html;

    }
    catch(error){

        document.getElementById("chat").innerHTML = `
            <div class="not-found">
                <h2>Error loading chat</h2>
                <p>Please try again later.</p>
            </div>
        `;

        console.error(error);
    }
}

loadChat();

</script>

</body>
</html>
